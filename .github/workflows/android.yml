name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # スマホのブラウザから APK を直接ダウンロードできるように Releases に置く
      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenRecorder.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android アプリ（ビルド ${{ github.run_number }}）
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android/ScreenRecorder.apk
          body: |
            スマホでこのページを開き、下の「ScreenRecorder.apk」をタップするとダウンロードできます。
            ダウンロードしたファイルを開いてインストールしてください（「提供元不明のアプリ」の許可を求められたら許可します）。
